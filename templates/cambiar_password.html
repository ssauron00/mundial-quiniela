{% extends "base.html" %}
{% block title %}Cambiar Contraseña - Mundial Quiniela{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:2rem auto;">
    <div class="card-header">
        <h2>🔒 Cambiar Contraseña</h2>
    </div>
    <form method="POST" action="{{ url_for('cambiar_password') }}">
        <div class="form-group">
            <label for="current_password">Contraseña actual</label>
            <div style="position:relative;">
                <input type="password" id="current_password" name="current_password" required placeholder="••••••••" style="padding-right:45px;">
                <span onclick="togglePassword('current_password')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;color:#888;">👁️</span>
            </div>
        </div>
        <div class="form-group">
            <label for="new_password">Nueva contraseña</label>
            <div style="position:relative;">
                <input type="password" id="new_password" name="new_password" required placeholder="Mínimo 6 caracteres" minlength="6" style="padding-right:45px;">
                <span onclick="togglePassword('new_password')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;color:#888;">👁️</span>
            </div>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar nueva contraseña</label>
            <div style="position:relative;">
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite la contraseña" style="padding-right:45px;">
                <span onclick="togglePassword('confirm_password')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;color:#888;">👁️</span>
            </div>
        </div>
        <button type="submit">💾 Cambiar contraseña</button>
        <a href="{{ url_for('welcome') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
function togglePassword(fieldId) {
    var input = document.getElementById(fieldId);
    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}
</script>
{% endblock %}
