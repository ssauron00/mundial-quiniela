{% extends "base.html" %}
{% block title %}Cambiar Contraseña - Mundial Quiniela{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:2rem auto;">
    <div class="card-header">
        <h2>🔒 Cambiar Contraseña</h2>
    </div>
    <form method="POST" action="{{ url_for('cambiar_password') }}">
        <div class="form-group">
            <label for="current_password">Contraseña actual</label>
            <input type="password" id="current_password" name="current_password" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="new_password">Nueva contraseña</label>
            <input type="password" id="new_password" name="new_password" required placeholder="Mínimo 6 caracteres" minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar nueva contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite la contraseña">
        </div>
        <button type="submit">💾 Cambiar contraseña</button>
        <a href="{{ url_for('welcome') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
