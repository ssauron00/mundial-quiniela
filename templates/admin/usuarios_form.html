{% extends "base.html" %}
{% block title %}{% if usuario %}Editar usuario{% else %}Nuevo usuario{% endif %} - Admin - Mundial Quiniela{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{% if usuario %}✏️ Editar usuario{% else %}➕ Nuevo usuario{% endif %}</h2>
    </div>
    <form method="POST" action="">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required value="{{ usuario.nombre if usuario else '' }}" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required value="{{ usuario.email if usuario else '' }}" placeholder="usuario@email.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña {% if usuario %}(dejar vacía para no cambiar){% endif %}</label>
            <input type="password" id="password" name="password" {% if not usuario %}required{% endif %} placeholder="{% if usuario %}Nueva contraseña (opcional){% else %}Contraseña{% endif %}">
        </div>
        <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="usuario" {% if usuario and usuario.rol == 'usuario' %}selected{% endif %}>Usuario</option>
                <option value="admin" {% if usuario and usuario.rol == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="form-group">
            <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                <input type="checkbox" name="activo" {% if not usuario or usuario.activo %}checked{% endif %} style="width:auto;">
                Usuario activo
            </label>
        </div>
        <button type="submit">💾 Guardar</button>
        <a href="{{ url_for('admin_usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
