<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Mundial Quiniela</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-box">
        <h2>⚽ Mundial Quiniela</h2>
        <p class="subtitle">Inicia sesión para participar</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" required placeholder="••••••••" style="padding-right:45px;">
                    <span id="togglePass" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;color:#888;">👁️</span>
                </div>
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <div class="links">
            <!-- ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a> -->
        </div>
    </div>

<script>
function togglePassword() {
    var input = document.getElementById('password');
    var icon = document.getElementById('togglePass');
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
    } else {
        input.type = 'password';
        icon.textContent = '👁️';
    }
}
</script>
</body>
</html>
